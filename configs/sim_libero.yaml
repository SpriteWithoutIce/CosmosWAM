# Cosmos-WAM LIBERO Evaluation Configuration

# Default output directory (timestamp will be appended)
output_dir: ./evaluate_results/libero

# Random seed
seed: 42

# Checkpoint path (required, override via command line)
ckpt: null

# Mixed precision for evaluation
mixed_precision: no

# Model configuration (should match training)
model:
  vae_checkpoint: /home/jwhe/linyihan/CKPT/cosmos/tokenizer.pth
  vae_temporal_window: 16
  lambda_action: 1.0
  num_cond_frames: 1
  
  dit_config:
    max_img_h: 224
    max_img_w: 448       # 2 cameras concatenated horizontally (224 * 2)
    max_frames: 128
    in_channels: 18
    out_channels: 16
    patch_spatial: 2
    patch_temporal: 1
    model_channels: 2048
    num_blocks: 28
    num_heads: 16
    mlp_ratio: 4.0
    atten_backend: "minimal_a2a"
    crossattn_emb_channels: 1024
    use_crossattn_projection: true
    crossattn_proj_in_channels: 100352
    pos_emb_cls: "rope3d"
    pos_emb_learnable: false
    rope_h_extrapolation_ratio: 1.0
    rope_w_extrapolation_ratio: 1.0
    rope_t_extrapolation_ratio: 1.0
    use_wan_fp32_strategy: false
    adaln_lora_dim: 256
    use_t_embedding_adaln_lora: true
  
  action_head:
    action_dim: 7          # LIBERO: 7维 (eef_pose 6 + gripper 1)
    hidden_dim: 1024
    num_layers: 14
    num_heads: 16
    video_dim: 2048
    mlp_ratio: 4.0
    actions_per_latent: 8
    state_dim: 8
    num_future_tokens: 32

# Data configuration (for processor and normalization)
# MUST MATCH TRAINING CONFIGURATION
data:
  train:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs: []
    shape_meta:
      images:
        - key: image          # agentview (main camera)
          raw_shape: [3, 512, 512]
          shape: [3, 224, 224]
        - key: wrist_image    # wrist camera
          raw_shape: [3, 512, 512]
          shape: [3, 224, 224]
      action:
        - key: default
          raw_shape: 7
          shape: 7
      state:
        - key: default
          raw_shape: 8
          shape: 8
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [224, 448]  # 2 cameras: 224x224 each, concatenated horizontally -> 224x448
    val_set_proportion: 0.0
    is_training_set: false
    skip_padding_as_possible: false
    concat_multi_camera: "horizontal"  # Concatenate 2 cameras horizontally
    processor:
      _target_: cosmos_wam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 2         # MUST MATCH TRAINING: 2 cameras
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, false]  # eef poses are delta, gripper is not
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: cosmos_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
      val_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
    text_embedding_cache_dir: ./data/text_embeds_cache/libero
    context_len: 128
    use_text_prompt_template: false  # LIBERO: hash raw task description only

# Evaluation settings
EVALUATION:
  # Task suite name: libero_spatial, libero_object, libero_goal, libero_10, libero_90
  task_suite_name: libero_spatial
  
  # Task ID (0-9 for most suites)
  task_id: 0
  
  # Output directory
  output_dir: ${output_dir}
  
  # Number of trials per task
  num_trials: 50
  
  # Dataset statistics path (required)
  dataset_stats_path: null
  
  # Text embedding cache directory (required)
  text_embedding_cache_dir: null
  
  # Device for evaluation
  device: cuda
  
  # Action horizon (number of actions to predict)
  action_horizon: 32
  
  # Replan steps (execute this many actions before replanning)
  replan_steps: 5
  
  # Number of diffusion inference steps
  num_inference_steps: 4
  
  # Number of steps to wait at the beginning (dummy steps)
  num_steps_wait: 5
  
  # Use action ensembler
  use_action_ensembler: false
  
  # Binarize gripper action
  binarize_gripper: false
  
  # Visualize future video (requires model support)
  visualize_future_video: false
  
  # Context length for text embeddings
  context_len: 128
  
  # GPU ID
  gpu_id: 0
  
  # Environment number (currently only 1 is supported)
  env_num: 1
  
  # Online text encoder settings (optional)
  use_online_text_encoder: false
  online_text_encoder_path: null
  text_encoder_device: cuda:0
