# Cosmos-WAM RoboTwin Evaluation Configuration

# Default output directory (timestamp will be appended)
output_dir: ./evaluate_results/robotwin

# Random seed
seed: 42

# Checkpoint path (required, override via command line)
ckpt: null

# Mixed precision for evaluation
mixed_precision: "no"

# Model configuration (should match training)
model:
  vae_checkpoint: /mnt/data/linyihan/ckpt/cosmos_base/tokenizer.pth
  vae_temporal_window: 16
  lambda_action: 1.0
  num_cond_frames: 1
  
  dit_config:
    max_img_h: 240
    max_img_w: 320
    max_frames: 128
    in_channels: 18
    out_channels: 16
    patch_spatial: 2
    patch_temporal: 1
    model_channels: 2048
    num_blocks: 28
    num_heads: 16
    mlp_ratio: 4.0
    atten_backend: "minimal_a2a"
    crossattn_emb_channels: 1024
    use_crossattn_projection: true
    crossattn_proj_in_channels: 100352
    pos_emb_cls: "rope3d"
    pos_emb_learnable: false
    rope_h_extrapolation_ratio: 1.0
    rope_w_extrapolation_ratio: 1.0
    rope_t_extrapolation_ratio: 1.0
    use_wan_fp32_strategy: false
    adaln_lora_dim: 256
    use_t_embedding_adaln_lora: true
  
  action_head:
    action_dim: 16
    hidden_dim: 1024
    num_layers: 28
    num_heads: 16
    video_dim: 2048
    mlp_ratio: 4.0
    actions_per_latent: 8

# Data configuration (for processor and normalization)
data:
  train:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs: []
    shape_meta:
      images:
        - key: cam_high
          raw_shape: [3, 480, 640]
          shape: [3, 240, 320]
      action:
        - key: default
          raw_shape: 16
          shape: 16
      state:
        - key: default
          raw_shape: 16
          shape: 16
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [240, 320]
    val_set_proportion: 0.05
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: "horizontal"
    processor:
      _target_: cosmos_wam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 1
      action_output_dim: 16
      proprio_output_dim: 16
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, true, false, true, true, true, true, true, true, true, false]
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: cosmos_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
      val_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
    text_embedding_cache_dir: /home/jwhe/linyihan/datasets/text_embeds_cache
    context_len: 512
    pretrained_norm_stats: null

# Evaluation settings
EVALUATION:
  # RoboTwin root directory (containing RoboTwin repository)
  robotwin_root: ./third_party/RoboTwin
  
  # Task name to evaluate (null = all tasks)
  task_name: null
  
  # Task configuration: demo_clean or demo_randomized
  task_config: demo_clean
  
  # Output directory (will be created)
  output_dir: ${output_dir}
  
  # Policy name in RoboTwin
  policy_name: cosmos_wam_policy
  
  # Instruction type: unseen or seen
  instruction_type: unseen
  
  # Number of episodes to evaluate
  eval_num_episodes: 50
  
  # Dataset statistics path (required)
  dataset_stats_path: null
  
  # Text embedding cache directory (required for normal lookup)
  text_embedding_cache_dir: null
  
  # Fixed text embedding path (optional, for testing with specific file)
  # If set, overrides text_embedding_cache_dir lookup
  fixed_text_embedding_path: null
  
  # Device for evaluation
  device: cuda
  
  # Action horizon (number of actions to predict)
  action_horizon: 8
  
  # Replan steps (execute this many actions before replanning)
  replan_steps: 4
  
  # Number of diffusion inference steps
  num_inference_steps: 20
  
  # Sigma shift for sampling (null = no shift)
  sigma_shift: null
  
  # Context length for text embeddings
  context_len: 512
  
  # Skip RGB rendering within replan window (faster evaluation)
  skip_get_obs_within_replan: true
  
  # Online Text Encoder Settings (for limited VRAM setups like RTX 4090 24GB)
  # Set use_online_text_encoder: true to compute text embeddings on-the-fly
  # instead of using precomputed cache. This allows running Reason1-7B on a 
  # separate GPU from the main inference model.
  # 
  # Example dual-GPU setup:
  #   use_online_text_encoder: true
  #   online_text_encoder_path: /path/to/Cosmos-Reason1-7B
  #   text_encoder_device: cuda:0  # GPU 0 for text encoder (~14GB VRAM)
  #   device: cuda:1               # GPU 1 for main model (remaining VRAM)
  use_online_text_encoder: false
  online_text_encoder_path: null
  text_encoder_device: null

# Multi-run settings for manager
MULTIRUN:
  # Number of GPUs to use
  num_gpus: 1
  
  # Maximum tasks per GPU
  max_tasks_per_gpu: 1

# GPU ID for single evaluation
gpu_id: 0
