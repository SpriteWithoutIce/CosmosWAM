output_dir: ./outputs/cosmos_2b_robotwin
seed: 42

model:
  dit_checkpoint: ./checkpoints/cosmos_dit.pt
  # VAE checkpoint 路径 - cosmos-predict2.5 会自动加载
  vae_checkpoint: /home/jwhe/linyihan/CKPT/cosmos/tokenizer.pth
  load_vae_weights: true
  enable_gradient_checkpointing: true
  lambda_action: 1.0
  num_cond_frames: 1
  vae_temporal_window: 16

  dit_config:
    max_img_h: 240
    max_img_w: 320
    max_frames: 128
    in_channels: 16
    out_channels: 16
    patch_spatial: 2
    patch_temporal: 1
    model_channels: 2048
    num_blocks: 28
    num_heads: 16
    mlp_ratio: 4.0
    atten_backend: "minimal_a2a"
    crossattn_emb_channels: 1024
    use_crossattn_projection: true
    crossattn_proj_in_channels: 100352
    pos_emb_cls: "rope3d"
    pos_emb_learnable: false
    rope_h_extrapolation_ratio: 1.0
    rope_w_extrapolation_ratio: 1.0
    rope_t_extrapolation_ratio: 1.0
    use_wan_fp32_strategy: false

  action_head:
    action_dim: 16          # RoboTwin 双臂: 16维 (左臂8维 + 右臂8维)
    hidden_dim: 1024
    num_layers: 14
    num_heads: 16
    video_dim: 2048
    mlp_ratio: 4.0
    actions_per_latent: 8

data:
  train:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    # RoboTwin 数据路径: 每个子文件夹是一个任务
    # 示例: ./data/lerobot_robotwin_eef_clean_50/close_the_box/
    dataset_dirs:
      - /home/jwhe/linyihan/datasets/lerobot_robotwin_eef_test
    shape_meta:
      images:
        # 只用主视角 cam_high
        # 原始 480x640，保持比例 resize 到 240x320 (4:3)
        - key: cam_high
          raw_shape: [3, 480, 640]
          shape: [3, 240, 320]
      action:
        - key: default
          raw_shape: 16             # RoboTwin 双臂: 16维
          shape: 16
      state:
        - key: default
          raw_shape: 16             # RoboTwin 双臂: 16维
          shape: 16
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4      # 50 FPS -> 12.5Hz action
    # 单相机 resize 到 240x320 (保持 480/640=0.75 比例)
    video_size: [240, 320]
    val_set_proportion: 0.05        # 5% 验证集
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: "horizontal"
    processor:
      _target_: cosmos_wam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 1         # 只用主视角
      action_output_dim: 16         # 双臂16维
      proprio_output_dim: 16        # 双臂16维
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, true, false, true, true, true, true, true, true, true, false]  # 第8和第16维是gripper，不做delta
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: cosmos_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
      val_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
    # 文本 embedding 缓存目录 (运行 precompute_text_embeddings.py 生成)
    text_embedding_cache_dir: /home/jwhe/linyihan/datasets/text_embeds_cache
    context_len: 512

  val:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
      - /home/jwhe/linyihan/datasets/lerobot_robotwin_eef_test
    shape_meta: ${data.train.shape_meta}
    num_frames: ${data.train.num_frames}
    global_sample_stride: ${data.train.global_sample_stride}
    action_video_freq_ratio: ${data.train.action_video_freq_ratio}
    video_size: ${data.train.video_size}
    val_set_proportion: ${data.train.val_set_proportion}
    is_training_set: false
    skip_padding_as_possible: ${data.train.skip_padding_as_possible}
    concat_multi_camera: ${data.train.concat_multi_camera}
    processor: ${data.train.processor}
    text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
    context_len: ${data.train.context_len}

trainer:
  output_dir: ${output_dir}
  learning_rate: 2.0e-5
  action_learning_rate: 1.0e-4
  weight_decay: 0.0
  batch_size: 4              # 单相机可以增大batch_size
  num_workers: 4
  num_epochs: 100
  max_steps: null
  log_every: 10
  save_every: 5000
  eval_every: 5000
  gradient_accumulation_steps: 1   # 不需要grad accumulation
  max_grad_norm: 1.0
  seed: ${seed}
  resume: false
  mixed_precision: bf16
  deepspeed:
    zero_optimization:
      stage: 2
