output_dir: ./outputs/cosmos_2b_libero
seed: 42

model:
  dit_checkpoint: /home/jwhe/linyihan/CKPT/cosmos/81edfebe-bd6a-4039-8c1d-737df1a790bf_ema_bf16.pt
  vae_checkpoint: /home/jwhe/linyihan/CKPT/cosmos/tokenizer.pth
  load_vae_weights: true
  enable_gradient_checkpointing: true
  lambda_action: 1.0
  num_cond_frames: 1
  vae_temporal_window: 16

  dit_config:
    max_img_h: 224
    max_img_w: 224       # 1 camera only (agentview)
    max_frames: 128
    in_channels: 18
    out_channels: 16
    patch_spatial: 2
    patch_temporal: 1
    model_channels: 2048
    num_blocks: 28
    num_heads: 16
    mlp_ratio: 4.0
    atten_backend: "minimal_a2a"
    crossattn_emb_channels: 1024
    use_crossattn_projection: true
    crossattn_proj_in_channels: 100352
    pos_emb_cls: "rope3d"
    pos_emb_learnable: false
    rope_h_extrapolation_ratio: 1.0
    rope_w_extrapolation_ratio: 1.0
    rope_t_extrapolation_ratio: 1.0
    use_wan_fp32_strategy: false
    adaln_lora_dim: 256
    use_t_embedding_adaln_lora: true

  action_head:
    action_dim: 7          # LIBERO: 7维 (eef_pose 6 + gripper 1)
    hidden_dim: 1024
    num_layers: 14
    num_heads: 16
    video_dim: 2048
    mlp_ratio: 4.0
    actions_per_latent: 8

data:
  train:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    # LIBERO 4 suites
    dataset_dirs:
      - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
      - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
      - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
      - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    shape_meta:
      images:
        - key: image          # Only agentview (main camera)
          raw_shape: [3, 512, 512]
          shape: [3, 224, 224]
        # wrist_image removed - using single camera only
      action:
        - key: default
          raw_shape: 7
          shape: 7
      state:
        - key: default
          raw_shape: 8
          shape: 8
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4      # 20 FPS -> 5Hz action
    video_size: [224, 224]          # Single camera 224x224
    val_set_proportion: 0.05
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: null       # No concatenation needed for single camera
    processor:
      _target_: cosmos_wam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 1         # Single camera only (agentview)
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, false]  # eef poses delta, gripper not
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: cosmos_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
      val_transforms:
        - _target_: cosmos_wam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
    text_embedding_cache_dir: ./data/text_embeds_cache/libero
    context_len: 128
    use_text_prompt_template: false  # LIBERO: hash raw task description only

  val:
    _target_: cosmos_wam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    pretrained_norm_stats: ${data.train.pretrained_norm_stats}
    dataset_dirs: ${data.train.dataset_dirs}
    shape_meta: ${data.train.shape_meta}
    num_frames: ${data.train.num_frames}
    global_sample_stride: ${data.train.global_sample_stride}
    action_video_freq_ratio: ${data.train.action_video_freq_ratio}
    video_size: ${data.train.video_size}
    val_set_proportion: ${data.train.val_set_proportion}
    is_training_set: false
    skip_padding_as_possible: ${data.train.skip_padding_as_possible}
    concat_multi_camera: ${data.train.concat_multi_camera}
    processor: ${data.train.processor}
    text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
    context_len: ${data.train.context_len}
    use_text_prompt_template: ${data.train.use_text_prompt_template}

trainer:
  output_dir: ${output_dir}
  learning_rate: 1.0e-4      # FastWAM LIBERO uses 1e-4
  action_learning_rate: 1.0e-4
  weight_decay: 1.0e-2       # FastWAM uses 1e-2
  batch_size: 16             # FastWAM LIBERO batch_size
  num_workers: 8
  num_epochs: 10
  max_steps: null
  log_every: 10
  save_every: 2000
  eval_every: 200
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: ${seed}
  resume: false
  mixed_precision: "bf16"
  
  lr_schedule: "cosine"
  warmup_steps: 100
  
  wandb:
    enabled: false
    project: "cosmos-wam-libero"
    name: null
  
  deepspeed:
    zero_optimization:
      stage: 1
