[project]
name = "cosmos-wam"
version = "0.1.0"
description = "Cosmos-based World Action Model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "accelerate>=0.25.0",
    "deepspeed>=0.12.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "transformers>=4.36.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "torchvision>=0.16.0",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmos_wam*"]
